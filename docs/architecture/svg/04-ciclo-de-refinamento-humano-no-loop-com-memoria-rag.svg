<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1140 750' width='1140' height='750'><rect x='0' y='0' width='1140' height='750' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#444444'/></marker></defs><rect x='380.0' y='40.0' width='340.0' height='60.0' rx='8' ry='8' fill='#dae8fc' stroke='#6c8ebf' stroke-width='1.5' /><rect x='380.0' y='140.0' width='340.0' height='60.0' rx='8' ry='8' fill='#dae8fc' stroke='#6c8ebf' stroke-width='1.5' /><rect x='380.0' y='240.0' width='340.0' height='70.0' rx='8' ry='8' fill='#dae8fc' stroke='#6c8ebf' stroke-width='1.5' /><rect x='800.0' y='245.0' width='280.0' height='90.0' rx='8' ry='8' fill='#fff2cc' stroke='#d6b656' stroke-width='1.5' /><ellipse cx='550.0' cy='380.0' rx='170.0' ry='30.0' fill='#d5e8d4' stroke='#82b366' stroke-width='1.5' /><rect x='380.0' y='450.0' width='340.0' height='60.0' rx='8' ry='8' fill='#dae8fc' stroke='#6c8ebf' stroke-width='1.5' /><rect x='380.0' y='550.0' width='340.0' height='70.0' rx='8' ry='8' fill='#dae8fc' stroke='#6c8ebf' stroke-width='1.5' /><rect x='380.0' y='650.0' width='340.0' height='60.0' rx='8' ry='8' fill='#dae8fc' stroke='#6c8ebf' stroke-width='1.5' /><text x='550.0' y='72.70' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='550.0' dy='0.00'>review_notes preenchido</tspan><tspan x='550.0' dy='16.20'>(checklist ou revisor reprovou)</tspan></text><text x='550.0' y='172.70' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='550.0' dy='0.00'>generate_ui_clarifying_questions</tspan><tspan x='550.0' dy='16.20'>(LLM gerador transforma review_notes em perguntas)</tspan></text><text x='550.0' y='269.60' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='550.0' dy='0.00'>Para cada pergunta:</tspan><tspan x='550.0' dy='16.20'>suggest_refinement_answer busca no Qdrant</tspan><tspan x='550.0' dy='16.20'>(embedding bge-m3) a resposta mais similar ja dada</tspan></text><text x='940.0' y='277.62' text-anchor='middle' font-size='11' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='940.0' dy='0.00'>Sugestao so exibida (emoji + score</tspan><tspan x='940.0' dy='14.85'>de similaridade) -- nunca aplicada</tspan><tspan x='940.0' dy='14.85'>automaticamente. Memoria compartilhada</tspan><tspan x='940.0' dy='14.85'>com o UX Designer (mesma colecao Qdrant).</tspan></text><text x='550.0' y='382.70' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='550.0' dy='0.00'>Humano digita a resposta final</tspan><tspan x='550.0' dy='16.20'>(input() no terminal, run.py)</tspan></text><text x='550.0' y='482.70' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='550.0' dy='0.00'>record_refinement_answer</tspan><tspan x='550.0' dy='16.20'>(grava pergunta+resposta no Qdrant, tipo_artefato='ui_specification')</tspan></text><text x='550.0' y='579.60' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='550.0' dy='0.00'>refine_ui_specification</tspan><tspan x='550.0' dy='16.20'>(reescreve so os campos que as respostas abordam,</tspan><tspan x='550.0' dy='16.20'>preserva o resto -- GR-UI-1 continua valendo)</tspan></text><text x='550.0' y='682.70' text-anchor='middle' font-size='12' font-family='Helvetica,Arial,sans-serif' fill='#1a1a1a'><tspan x='550.0' dy='0.00'>finalize_ui_specification</tspan><tspan x='550.0' dy='16.20'>(revalida: validate -&gt; review -&gt; synthesize_recommendations)</tspan></text><path d='M550.0,100.0 L550.0,140.0' fill='none' stroke='#444444' stroke-width='1.5' marker-end="url(#arrow)"/><path d='M550.0,200.0 L550.0,240.0' fill='none' stroke='#444444' stroke-width='1.5' marker-end="url(#arrow)"/><path d='M720.0,275.0 L